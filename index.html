  <meta property="og:title" content="e-tuitionBD | Premium Private Education" />
  <meta property="og:description" content="Connect with verified tutors in Bangladesh directly. No agent fees, real results." />

  <script type="speculationrules">
    {
      "prerender": [
        { "where": { "href_matches": "/dashboard/*" }, "eagerness": "moderate" },
        { "where": { "href_matches": "/tutors/*" }, "eagerness": "moderate" }
      ]
    }
  </script>
  <script>
    (function() {
      try {
        var storedTheme = localStorage.getItem('theme');
        if (storedTheme === 'dark' || (!storedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      } catch (e) {}
    })();
  </script>
  <script>
    // GA4 bootstrap — the measurement id comes from the backend's public
    // GET /api/config (the frontend has NO environment variables). The same
    // fetch result is cached on window.__ETUITION_CONFIG__ so the app's
    // clientConfig loader reuses it instead of requesting /api/config twice.
    // Fails silent: no config or no id → analytics simply stays a no-op.
    (function () {
      try {
        var API_URL = '%MODE%' === 'development'
          ? 'http://localhost:5000'
          : 'https://etuitionhub-backend.vercel.app';
        fetch(API_URL + '/api/config')
          .then(function (res) { return res.ok ? res.json() : null; })
          .then(function (cfg) {
            if (!cfg) return;
            window.__ETUITION_CONFIG__ = cfg;
            var id = cfg.gaMeasurementId || (cfg.firebase && cfg.firebase.measurementId);
            if (!id || typeof window.gtag === 'function') return;
            window.dataLayer = window.dataLayer || [];
            window.gtag = function () { window.dataLayer.push(arguments); };
            window.gtag('js', new Date());
            var s = document.createElement('script');
            s.async = true;
            s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(id);
            document.head.appendChild(s);
            // send_page_view:false — the SPA's trackPageView() reports route changes.
            window.gtag('config', id, { send_page_view: false });
          })
          .catch(function () { /* analytics unavailable — never block page render */ });
      } catch (e) { /* never block page render */ }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
